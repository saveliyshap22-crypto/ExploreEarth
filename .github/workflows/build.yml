name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EarthExplorer.sln

      - name: Build
        run: dotnet build EarthExplorer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EarthExplorer.sln --configuration Release --no-build --logger trx

      - name: Publish win-x64
        run: dotnet publish src/EarthExplorer.App/EarthExplorer.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64 -p:PublishSingleFile=false

      - name: Bundle local OCR models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/win-x64/tessdata | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata -OutFile artifacts/win-x64/tessdata/eng.traineddata
          Invoke-WebRequest https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata -OutFile artifacts/win-x64/tessdata/rus.traineddata
          Get-ChildItem artifacts/win-x64/tessdata/*.traineddata | ForEach-Object {
            if ($_.Length -lt 1000000) { throw "OCR model $($_.Name) is unexpectedly small" }
            Get-FileHash $_.FullName -Algorithm SHA256
          }

      - name: Prepare portable ZIP and prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/downloads | Out-Null
          New-Item -ItemType Directory -Force artifacts/prerequisites | Out-Null
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/downloads/ExploreEarth-portable-win-x64.zip -CompressionLevel Optimal
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile artifacts/prerequisites/vc_redist.x64.exe
          if ((Get-Item artifacts/prerequisites/vc_redist.x64.exe).Length -lt 1000000) { throw "VC++ redistributable download failed" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/ExploreEarth.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ExploreEarth-downloads
          path: artifacts/downloads
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.2.0 artifacts/downloads/* --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create v0.2.0 artifacts/downloads/* --target $env:GITHUB_SHA --title "ExploreEarth 0.2.0" --notes "Готовый установщик Windows x64 и portable-сборка. Локальный OCR eng/rus, GeoGuesser и два вида карты." --repo $env:GITHUB_REPOSITORY
          }
