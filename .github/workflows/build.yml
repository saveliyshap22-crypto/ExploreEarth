name: Windows build

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EarthExplorer.sln

      - name: Build
        run: dotnet build EarthExplorer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EarthExplorer.sln --configuration Release --no-build --logger trx

      - name: Publish win-x64
        run: dotnet publish src/EarthExplorer.App/EarthExplorer.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-build --output artifacts/win-x64 -p:PublishSingleFile=false

      - uses: actions/upload-artifact@v4
        with:
          name: ExploreEarth-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
